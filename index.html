<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Tham quan Hoi An Zero Waste Center</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #dcf3e6; /* Màu nền xanh nhạt đồng bộ */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .image-wrapper {
            text-align: center;
        }

        .original-img {
            /* Giữ nguyên kích thước thật của ảnh, không phóng to */
            width: auto;
            height: auto;
            /* Chỉ thu nhỏ lại nếu màn hình điện thoại hẹp hơn ảnh */
            max-width: 100%; 
            display: block;
            margin: 0 auto;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .action-area {
            margin-top: 25px;
            text-align: center;
        }

        .register-btn {
            display: inline-block;
            background: linear-gradient(135deg, #2d6a4f, #40916c);
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            padding: 15px 42px;
            border-radius: 50px;
            box-shadow: 0 6px 20px rgba(45, 106, 79, 0.35);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: pulse 2s infinite;
        }

        .register-btn:hover {
            background: linear-gradient(135deg, #1b4332, #2d6a4f);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(27, 67, 50, 0.45);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(64, 145, 108, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(64, 145, 108, 0); }
            100% { box-shadow: 0 0 0 0 rgba(64, 145, 108, 0); }
        }
    </style>
</head>
<body>

    <div class="image-wrapper">
        <img src="https://github.com/phamdiem27/giamthieuracthainhuafzs/blob/main/8ab8f1cc-1989-4d07-93a8-8ea6c18a8d66.jpg?raw=true" alt="Poster sự kiện" class="original-img">
    </div>

    <div class="action-area">
        <a href="https://forms.gle/62FZRFS8gayJ4h2w9" class="register-btn" target="_blank" rel="noopener noreferrer">
            ĐĂNG KÝ THAM GIA NGAY
        </a>
    </div>

</body>
</html>
